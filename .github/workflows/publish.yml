name: Publish to PyPI

# Runs when a GitHub release is published. It uses PyPI "Trusted Publishing": no password or API
# token is stored anywhere. One-time setup on pypi.org (Account -> Publishing -> add a publisher):
#   PyPI project name: kaizeval
#   Owner: abdullahahmed94      Repository: kaizeval
#   Workflow name: publish.yml  Environment name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: python -m pip install build twine && python -m build && twine check dist/*
      - name: The wheel must contain the web console
        run: python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'kaizeval/webui/index.html' in n, 'console missing from wheel'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
