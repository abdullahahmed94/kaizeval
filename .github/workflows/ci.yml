name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      # The suite runs in strict offline mode and fails on any non-loopback connection,
      # so no secrets and no external services are needed.
      - run: pytest

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  package:
    name: Wheel with bundled console
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: python -m pip install build && python -m build
      - name: Install the wheel and run the demo journey end to end
        run: |
          python -m pip install dist/*.whl
          kaizeval demo --no-serve --data-dir "$RUNNER_TEMP/kaizeval-demo"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nKAIZEVAL_SECRET_KEY=%s\nSAMPLE_AGENT_ADMIN_TOKEN=%s\n' \
            "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .env
          docker compose -f deploy/docker-compose.yml --env-file .env --profile demo up -d --build --wait --wait-timeout 300
      - name: Check health and the API
        run: |
          curl --fail --silent http://127.0.0.1:8000/readyz
          curl --fail --silent http://127.0.0.1:8000/api/v1/system
          curl --fail --silent http://127.0.0.1:8000/ | grep -qi "<!doctype html"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --no-color | tail -200
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v
